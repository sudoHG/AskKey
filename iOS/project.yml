# The iPhone app (#289, ADR 0013 → iPhone app; #314, ADR 0014 → iPhone app) and
# its notification extension (#315, ADR 0014 → Notification Service Extension).
# Generate the Xcode project with `bash scripts/build-ios.sh`; it is never committed.
name: AskKeyiOS
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  AskKey:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The catalogs are maintained by hand; a build never rewrites them.
    SWIFT_EMIT_LOC_STRINGS: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  AskKeyiOSKit:
    type: framework
    platform: iOS
    sources:
      - path: AskKeyiOSKit
    dependencies:
      - package: AskKey
        product: AskKeyDevices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sudohg.askkey.ios.kit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
  AskKeyiOS:
    type: application
    platform: iOS
    sources:
      - path: AskKeyiOS
    dependencies:
      - target: AskKeyiOSKit
      - target: AskKeyiOSNotificationService
    settings:
      base:
        PRODUCT_NAME: AskKey
        PRODUCT_BUNDLE_IDENTIFIER: com.sudohg.askkey.ios
        INFOPLIST_FILE: AskKeyiOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: AskKeyiOS/AskKeyiOS.entitlements
        # Empty unless the Ad Hoc export of scripts/build-ios.sh sets it; the
        # app creates a CloudKit container only when its Info.plist names one.
        CLOUDKIT_CONTAINER_IDENTIFIER: ""
  # The extension links AskKeyDevices and the kit's keychain code, never the
  # kit itself, so no SwiftUI view code is in it.
  AskKeyiOSNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: AskKeyiOSNotificationService/Sources
      - path: AskKeyiOSNotificationService/Resources
      - path: AskKeyiOSKit/Services/DeviceKeychain.swift
    dependencies:
      - package: AskKey
        product: AskKeyDevices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sudohg.askkey.ios.notification-service
        INFOPLIST_FILE: AskKeyiOSNotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: AskKeyiOSNotificationService/AskKeyiOSNotificationService.entitlements
        # As for the app: empty unless the Ad Hoc export sets it.
        CLOUDKIT_CONTAINER_IDENTIFIER: ""
  # Hostless tests of the extension's logic: they compile its sources and
  # catalog themselves, as an extension cannot host tests.
  AskKeyiOSNotificationServiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AskKeyiOSNotificationService/Tests
      - path: AskKeyiOSNotificationService/Sources
      - path: AskKeyiOSNotificationService/Resources
      - path: AskKeyiOSKit/Services/DeviceKeychain.swift
    dependencies:
      - package: AskKey
        product: AskKeyDevices
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sudohg.askkey.ios.notification-service.tests
        GENERATE_INFOPLIST_FILE: YES
  AskKeyiOSKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AskKeyiOSKitTests
    dependencies:
      - target: AskKeyiOSKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sudohg.askkey.ios.kit.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AskKeyiOS:
    build:
      targets:
        AskKeyiOS: all
    archive:
      config: Release
  AskKeyiOSKitTests:
    build:
      targets:
        AskKeyiOSKitTests: [test]
        AskKeyiOSNotificationServiceTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AskKeyiOSKitTests
        - AskKeyiOSNotificationServiceTests
