name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Report toolchain and Release SDK
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      # Sparkle's binary archive comes from GitHub Releases. swift and
      # xcodebuild both read it from this shared cache, so a hit never
      # contacts GitHub Releases; a miss downloads exactly as before.
      - name: Restore SwiftPM dependency cache
        id: swiftpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}

      - name: Resolve package dependencies
        run: swift package resolve

      # Saved right after resolution, so failed or cancelled runs still keep it.
      - name: Save SwiftPM dependency cache
        if: steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}

      - name: Build
        run: |
          swift build
          BIN_DIR="$(swift build --show-bin-path)"
          python3 scripts/check_sdk_markers.py "$BIN_DIR/AskKeyApp" "$BIN_DIR/AskKeyE2EApp" "$BIN_DIR/askkey"

      # The iPhone app (#289) links AskKeyDevices through Xcode, so Xcode must
      # build it from the root package for the iOS Simulator.
      - name: Build AskKeyDevices for the iOS Simulator
        run: |
          DERIVED_DATA="$RUNNER_TEMP/askkey-devices-ios"
          xcodebuild build -scheme AskKeyDevices -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO -quiet
          test -f "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/AskKeyDevices.o"

      - name: Test
        run: |
          swift test
          python3 scripts/check_sdk_markers.py --test-products "$(swift build --show-bin-path)"

      - name: Check release binary for E2E symbols
        run: |
          bash scripts/check_release_symbols.sh
          python3 scripts/check_sdk_markers.py "$(swift build -c release --show-bin-path)/AskKeyApp"

      - name: Check optimized cancellation runtime
        run: bash scripts/test-cancellation-runtime.sh

      - name: Verify UI delivery gate rejects incomplete runs
        run: python3 -m unittest discover -s Tests/Automation -v

      - name: Check isolated development launcher
        run: bash scripts/test-dev-launch.sh

      - name: Check repository hygiene
        run: python3 scripts/check_hygiene.py

      - name: Check module dependencies
        run: python3 scripts/check_module_deps.py

  basic-ui-flows:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Report toolchain and Release SDK
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Restore SwiftPM dependency cache
        id: swiftpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
      - name: Resolve package dependencies
        run: swift package resolve
      - name: Save SwiftPM dependency cache
        if: steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}
      - name: Install XcodeGen
        run: brew list xcodegen || brew install xcodegen
      - name: Run required desktop flows
        run: |
          bash scripts/run-e2e.sh
          python3 scripts/check_sdk_markers.py .build/AskKeyApp.app/Contents/MacOS/AskKeyApp .build/AskKeyApp.app/Contents/Helpers/askkey
      - name: Capture optional key screen screenshots
        continue-on-error: true
        run: bash scripts/run-e2e.sh screenshots
      - name: Preserve UI evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: askkey-basic-ui-evidence
          path: Tests/UI/output/
          if-no-files-found: error
          retention-days: 7

  ios-app:
    # The pairing-only iPhone app (#289). release-gate.py does not require
    # this job, but a PR that changes the app needs it green.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Report toolchain and simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Restore SwiftPM dependency cache
        id: swiftpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
      - name: Resolve package dependencies
        run: swift package resolve
      - name: Save SwiftPM dependency cache
        if: steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}
      - name: Install XcodeGen
        run: brew list xcodegen || brew install xcodegen
      - name: Build the app for the iOS Simulator
        run: bash scripts/build-ios.sh build
      - name: Run AskKeyiOSKitTests on a simulator and render the screens
        run: bash scripts/build-ios.sh test
      - name: Upload the rendered screens
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: askkey-ios-screens
          path: .build/ios/screens/
          if-no-files-found: error
          retention-days: 14

  release-sdk-window-check:
    # The preview image is informational; the two macos-latest jobs remain required.
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Report toolchain and Release SDK
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Restore SwiftPM dependency cache
        id: swiftpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.resolved') }}
      - name: Resolve package dependencies
        run: swift package resolve
      - name: Save SwiftPM dependency cache
        if: steps.swiftpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.swiftpm-cache.outputs.cache-primary-key }}
      - name: Build and check Debug and Release SDK markers
        run: |
          swift build --product AskKeyApp
          swift build -c release --product AskKeyApp --jobs 2
          python3 scripts/check_sdk_markers.py "$(swift build --show-bin-path)/AskKeyApp" "$(swift build -c release --show-bin-path)/AskKeyApp"
      - name: Check visible management-window lifecycle with the Release SDK
        run: swift test --filter ManagementWindowSizingTests/testVisibleWindowLifecycleKeepsTheDesignedFrameOnCI
